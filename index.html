function save(){localStorage.setItem('trail45k',JSON.stringify(store))}function dateObj(s){return new Date(s.date+'T12:00:00')}function fmt(d){return d.toLocaleDateString('fr-BE',{weekday:'long',day:'numeric',month:'long'})}function pace(sec){if(!sec)return'';return Math.floor(sec/60)+"'"+String(sec%60).padStart(2,'0')+'/km'}
function target(s){if(!s.family||!s.pace)return s.base||'';let prev=SESSIONS.filter(x=>x.family===s.family&&dateObj(x)<dateObj(s)&&x.pace).sort((a,b)=>dateObj(b)-dateObj(a))[0];let p=s.pace;if(prev){let res=store[prev.id];let prevTarget=target(prev);let pm=/^(\d+)'(\d{2})/.exec(prevTarget);if(pm){p=+pm[1]*60 + +pm[2];if(res==='OK')p-=5;if(res==='ÉCHEC')p+=5;}}return pace(p)}
function statusButtons(s){if(!['COURT','LONG','SL'].includes(s.family)&&!s.type.includes('SPÉCIFIQUE'))return'';return `<div class="actions">${['OK','LIMITE','ÉCHEC'].map(x=>`<button class="btn ${x==='OK'?'ok':x==='LIMITE'?'limit':'fail'} ${store[s.id]===x?'active':''}" onclick="setStatus('${s.id}','${x}')">${x}</button>`).join('')}</div>`}
function setStatus(id,v){store[id]=store[id]===v?'':v;save();render()}
function currentSession(){let now=new Date();let future=SESSIONS.filter(s=>dateObj(s)>=new Date(now.getFullYear(),now.getMonth(),now.getDate())).sort((a,b)=>dateObj(a)-dateObj(b));return future[0]||SESSIONS[SESSIONS.length-1]}
function weekSessions(s){return SESSIONS.filter(x=>x.week===s.week)}function card(s){return `<div class="card hero"><div class="date">${fmt(dateObj(s))} · ${s.week} · ${s.phase}</div><div class="stype">${s.type}</div><div class="pres">${s.prescription}</div>${target(s)?`<div class="target">Cible : <b>${target(s)}</b></div>`:''}${statusButtons(s)}</div>`}
function renderToday(){let s=currentSession(), ws=weekSessions(s),km=ws.reduce((a,x)=>a+(+x.km||0),0);document.querySelector('#today').innerHTML=card(s)+`<div class="statgrid"><div class="stat"><span class="small">Semaine</span><b>${s.week}</b>${km.toFixed(1).replace('.0','')} km planifiés</div><div class="stat"><span class="small">D+ cible</span><b>${Math.max(...ws.map(x=>+x.dplus||0))} m</b>${ws.length} séances affichées</div></div><div class="note">Les résultats sont enregistrés uniquement sur cet appareil. OK accélère de 5 s/km la prochaine séance de la même famille, LIMITE maintient la cible, ÉCHEC ajoute 5 s/km.</div>`}
function renderWeek(){let s=currentSession(),ws=weekSessions(s);document.querySelector('#week').innerHTML=`<div class="weekhead"><h2>${s.week}</h2><span class="small">${s.phase}</span></div><div class="card">${ws.map(x=>`<div class="row"><div class="dow">${x.day}<br>${dateObj(x).getDate()}/${dateObj(x).getMonth()+1}</div><div><div class="rtitle">${x.type}</div><div class="rsub">${x.prescription}</div></div><div class="pill ${store[x.id]?'done':''}">${store[x.id]||target(x)||((+x.km||0)?x.km+' km':'')}</div></div>`).join('')}</div>`}
function renderProgram(){let out='',last='';for(const s of SESSIONS){let m=dateObj(s).toLocaleDateString('fr-BE',{month:'long',year:'numeric'});if(m!==last){out+=`<div class="month">${m.toUpperCase()}</div>`;last=m}out+=`<div class="card"><div class="date">${fmt(dateObj(s))} · ${s.week}</div><div class="rtitle">${s.type}</div><div class="rsub">${s.prescription}</div>${target(s)?`<div class="target">Cible : <b>${target(s)}</b></div>`:''}${statusButtons(s)}</div>`}document.querySelector('#program').innerHTML=out}
function render(){let days=Math.ceil((RACE-new Date())/86400000);document.querySelector('#countdown').textContent=days>=0?`J-${days} · 45 km / 1500 D+ · objectif 6'30/km`:'Course terminée';renderToday();renderWeek();renderProgram()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('main').forEach(m=>m.classList.add('hidden'));document.querySelector('#'+b.dataset.v).classList.remove('hidden');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});render();</script></body></html>
