r(--line);padding:11px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:4px;z-index:20}.bottom button{flex:1;max-width:170px;border:0;background:none;color:var(--muted);padding:7px 2px;border-radius:10px;font-size:11px}.bottom button.active{color:var(--green)}.bottom .ico{display:block;font-size:23px;margin-bottom:4px}.section{font-size:17px;margin:24px 0 12px}.note{background:#25281d;border:1px solid #514c2d;color:#e8d6ab;padding:14px;border-radius:14px;font-size:13px;line-height:1.5}.btn{background:var(--green);color:#092014;border:0;border-radius:12px;padding:13px 16px;font-weight:800}.btn.secondary{background:var(--panel2);color:var(--white);border:1px solid var(--line)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.exercise{display:grid;grid-template-columns:1.6fr .65fr .65fr .8fr auto;gap:6px;margin:8px 0}.exercise input{padding:9px 6px;min-width:0}.exercise button{border:0;background:#3d2826;color:#ffd0c9;border-radius:9px}.help{font-size:12px;color:var(--muted);line-height:1.55}.hidden{display:none!important}@media(max-width:420px){.exercise{grid-template-columns:1.4fr .6fr .6fr .7fr 28px}.exercise input{font-size:12px}.app{padding-left:13px;padding-right:13px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><div class="logo">♧</div><div><div class="eyebrow">TRAIL 45 KM</div><div class="sub">Carnet d'entraînement · 11 avril 2027</div></div></div><button id="goToday">Aujourd'hui</button></header><div id="screen"></div></main><nav class="bottom"><button data-tab="week"><span class="ico">▦</span>Ma semaine</button><button data-tab="all"><span class="ico">☷</span>Programme complet</button><button data-tab="stats"><span class="ico">◫</span>Statistiques</button><button data-tab="settings"><span class="ico">⚙</span>Sauvegardes</button></nav><input type="file" id="restore" accept=".json,application/json" class="hidden"><script src="plan.js"></script><script>
'use strict';const PLAN=window.TRAIL_PLAN;const KEY='trail45-v1';let state={sessions:{},exercises:{}};try{let saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&typeof saved==='object'){state.sessions=saved.sessions||{};state.exercises=saved.exercises||{}}}catch(e){}const weekdays=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];const months=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];const localDate=d=>new Date(d+'T12:00:00');const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const add=(s,n)=>{let d=localDate(s);d.setDate(d.getDate()+n);return iso(d)};const today=iso(new Date());const todayWeek=()=>{let i=PLAN.findIndex(w=>today>=w.start&&today<=add(w.start,6));return i<0?(today<PLAN[0].start?0:PLAN.length-1):i};let wi=todayWeek(),tab='week',openWeek=todayWeek(),jumpToCurrent=false;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n).toLocaleString('fr-BE',{maximumFractionDigits:1});const pace=n=>`${Math.floor(n/60)}'${String(Math.round(n%60)).padStart(2,'0')}/km`;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Impossible de sauvegarder sur cet appareil. Exporte une sauvegarde.')}};const ses=(id)=>state.sessions[id]||{};const allSessions=()=>PLAN.flatMap(w=>days(w));function days(w){let base=w.start;return [{id:base+'-strength',date:base,type:'strength',title:w.strength||'Musculation',km:0,w},{id:add(base,1)+'-ef',date:add(base,1),type:w.tue?'ef':'rest',title:w.tue?'Endurance fondamentale':'Repos',km:w.tue,w},{id:add(base,2)+'-quality',date:add(base,2),type:w.qkm?'quality':'rest',title:w.quality||'Repos',km:w.qkm,w},{id:add(base,3)+'-ef',date:add(base,3),type:w.thu?'ef':'rest',title:w.thu?'Endurance fondamentale':'Repos',km:w.thu,w},{id:add(base,4)+'-rest',date:add(base,4),type:'rest',title:'Repos',km:0,w},{id:add(base,5)+'-rest',date:add(base,5),type:'rest',title:'Repos',km:0,w},{id:add(base,6)+'-long',date:add(base,6),type:'long',title:w.week===22?'Trail 45 km · Compétition':'Sortie longue',km:w.long,w}]};
function paceFor(w){if(!w.family)return null;let same=PLAN.filter(p=>p.week<w.week&&p.family===w.family);if(!same.length)return w.base;let prev=same[same.length-1],speed=paceFor(prev),result=ses(add(prev.start,2)+'-quality').status||'';if(result==='ECHEC')return Math.max(240,speed+5);if(result!=='OK'||w.block.toLowerCase().includes('allégée'))return speed;return Math.max(240,speed+(w.work>prev.work?-2:-5))}
function labelStatus(s){return ({'TODO':'À FAIRE','OK':'OK','LIMITE':'LIMITE','ECHEC':'ÉCHEC','SKIP':'NON FAIT'})[s]||'À FAIRE'}function statusClass(s){return s==='OK'?'ok':s==='ECHEC'?'fail':s==='LIMITE'?'limit':''}function dayCard(s){let d=localDate(s.date),v=ses(s.id),rest=s.type==='rest',str=s.type==='strength';let name=weekdays[d.getDay()]+' '+d.getDate()+' '+months[d.getMonth()];let p=s.type==='quality'?paceFor(s.w):null;return `<article class="day ${s.date===today?'today':''}" id="s-${s.id}"><div class="dayhead"><div class="datepill">${d.getDate()}</div><div style="flex:1;min-width:0"><div class="dayname">${esc(name)}</div><h3>${esc(s.title)}</h3></div>${rest?'':`<span class="pill ${statusClass(v.status)}">${labelStatus(v.status)}</span>`}</div>${rest?'<div class="detail">Récupération · aucune saisie nécessaire</div>':`<div class="detail">${str?'Carnet de musculation':`Prévu <strong>${fmt(s.km)} km</strong>${p!==null?` · Allure cible <strong>${pace(p)}</strong>`:''}${s.type==='quality'&&s.w.reps?`<br>${s.w.reps} répétitions · ${fmt(s.w.work)} ${s.w.family==='SEUIL'?'minutes':'km'} de travail`:''}`}</div><div class="fields">${str?'':`<div class="field"><label>Km réalisés</label><input inputmode="decimal" type="number" min="0" step="0.1" data-id="${s.id}" data-key="km" value="${esc(v.km??'')}" placeholder="—"></div><div class="field"><label>D+ réalisé (m)</label><input inputmode="numeric" type="number" min="0" step="1" data-id="${s.id}" data-key="dplus" value="${esc(v.dplus??'')}" placeholder="—"></div>`}<div class="field wide"><label>Résultat de la séance</label><select data-id="${s.id}" data-key="status">${[['TODO','À FAIRE'],['OK','OK'],['LIMITE','LIMITE'],['ECHEC','ÉCHEC'],['SKIP','NON FAIT']].map(([a,b])=>`<option value="${a}" ${(v.status||'TODO')===a?'selected':''}>${b}</option>`).join('')}</select></div>${str?`<div class="wide"><label class="sub">Exercices · séries · répétitions · charge (kg)</label><div id="ex-${s.id}">${exerciseRows(s.id)}</div><button class="btn secondary" data-add="${s.id}" type="button">+ Ajouter un exercice</button></div>`:''}<div class="field wide"><label>${str?'Notes de musculation':'Notes / ressenti'}</label><textarea data-id="${s.id}" data-key="notes" placeholder="${str?'Ex. Squat 3×8 à 55 kg, RDL 3×10 à 45 kg…':'Sensations, fatigue, douleurs, météo…'}">${esc(v.notes||'')}</textarea></div></div>`}</article>`}
function exerciseRows(id){return (state.exercises[id]||[]).map((x,i)=>`<div class="exercise"><input aria-label="Exercice" placeholder="Exercice" data-ex="${id}" data-i="${i}" data-f="name" value="${esc(x.name||'')}"><input aria-label="Séries" inputmode="numeric" type="number" min="0" placeholder="Sér." data-ex="${id}" data-i="${i}" data-f="sets" value="${esc(x.sets??'')}"><input aria-label="Répétitions" inputmode="numeric" type="number" min="0" placeholder="Rép." data-ex="${id}" data-i="${i}" data-f="reps" value="${esc(x.reps??'')}"><input aria-label="Charge en kg" inputmode="decimal" type="number" min="0" step="0.5" placeholder="kg" data-ex="${id}" data-i="${i}" data-f="kg" value="${esc(x.kg??'')}"><button data-del="${id}" data-i="${i}" aria-label="Supprimer exercice">×</button></div>`).join('')}
function weekStats(w){let ds=days(w).filter(s=>s.type!=='rest'),done=ds.filter(s=>ses(s.id).status==='OK'||ses(s.id).status==='LIMITE').length,actual=ds.reduce((a,s)=>a+(Number(ses(s.id).km)||0),0),planned=ds.reduce((a,s)=>a+s.km,0),dactual=ds.reduce((a,s)=>a+(Number(ses(s.id).dplus)||0),0);return {done,actual,planned,dactual,total:ds.length}}
function weekSummary(w){let x=weekStats(w);return `<section class="summary"><div class="sub">Kilomètres de la semaine · ${esc(w.block)}</div><div class="metric">${fmt(x.actual)} <span class="sub">/ ${fmt(x.planned)} km</span></div><div class="track"><div class="fill" style="width:${Math.min(100,x.planned?x.actual/x.planned*100:0)}%"></div></div><div class="statsline"><span>${x.done} / ${x.total} séances validées</span><span>D+ ${fmt(x.dactual)} / ${fmt(w.dplus)} m</span></div></section>`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let el=document.getElementById('screen');if(tab==='week'){let w=PLAN[wi];el.innerHTML=`<div class="eyebrow">TON CARNET DE ROUTE</div><h1 class="title">Ma semaine</h1><p class="lead">Un pas après l'autre, vers les 45 km.</p><div class="navweek"><button id="prev" ${wi===0?'disabled':''}>‹</button><div><strong>SEMAINE ${String(w.week).padStart(2,'0')} · 22</strong><small>${localDate(w.start).getDate()} ${months[localDate(w.start).getMonth()]} — ${localDate(add(w.start,6)).getDate()} ${months[localDate(add(w.start,6)).getMonth()]}</small></div><button id="next" ${wi===21?'disabled':''}>›</button></div>${weekSummary(w)}<h2 class="section">Les 7 jours</h2>${days(w).map(dayCard).join('')}`;document.getElementById('prev').onclick=()=>{wi=Math.max(0,wi-1);render();window.scrollTo(0,0)};document.getElementById('next').onclick=()=>{wi=Math.min(21,wi+1);render();window.scrollTo(0,0)}}else if(tab==='all'){el.innerHTML=`<div class="eyebrow">LES 22 SEMAINES</div><h1 class="title">Programme complet</h1><p class="lead">La semaine actuelle s'ouvre automatiquement.</p>${PLAN.map(w=>`<section class="weekrow ${w.week===todayWeek()+1?'current':''}" id="w-${w.week}"><button data-expand="${w.week}"><span><strong>Semaine ${String(w.week).padStart(2,'0')} · ${esc(w.block)}</strong><small>${localDate(w.start).getDate()} ${months[localDate(w.start).getMonth()]} — ${localDate(add(w.start,6)).getDate()} ${months[localDate(add(w.start,6)).getMonth()]} · ${fmt(weekStats(w).planned)} km · ${fmt(w.dplus)} D+</small></span><span>${openWeek===w.week-1?'⌃':'⌄'}</span></button>${openWeek===w.week-1?`<div class="weekinner">${weekSummary(w)}${days(w).map(dayCard).join('')}</div>`:''}</section>`).join('')}`;if(jumpToCurrent){jumpToCurrent=false;requestAnimationFrame(()=>{let x=document.getElementById('w-'+(todayWeek()+1));if(x)x.scrollIntoView({block:'start',behavior:'instant'})})}}else if(tab==='stats'){let all=allSessions().filter(s=>s.type!=='rest'),total=all.reduce((a,s)=>a+s.km,0),actual=all.reduce((a,s)=>a+(Number(ses(s.id).km)||0),0),dplus=all.reduce((a,s)=>a+(Number(ses(s.id).dplus)||0),0),done=all.filter(s=>['OK','LIMITE'].includes(ses(s.id).status)).length;el.innerHTML=`<div class="eyebrow">TON ÉVOLUTION</div><h1 class="title">Statistiques</h1><p class="lead">Tes données, mises à jour après chaque séance.</p><section class="summary"><div class="sub">Distance totale réalisée</div><div class="metric">${fmt(actual)} <span class="sub">/ ${fmt(total)} km</span></div><div class="track"><div class="fill" style="width:${Math.min(100,actual/total*100)}%"></div></div><div class="statsline"><span>${done} séances validées</span><span>${fmt(dplus)} m D+ cumulés</span></div></section><h2 class="section">Suivi par semaine</h2>${PLAN.map(w=>{let x=weekStats(w);return `<div class="day"><div style="display:flex;justify-content:space-between"><strong>Semaine ${w.week}</strong><span class="sub">${fmt(x.actual)} / ${fmt(x.planned)} km</span></div><div class="track"><div class="fill" style="width:${Math.min(100,x.planned?x.actual/x.planned*100:0)}%"></div></div></div>`}).join('')}`;}else{el.innerHTML=`<div class="eyebrow">TES DONNÉES</div><h1 class="title">Sauvegardes</h1><p class="lead">Les résultats sont stockés sur cet iPhone. Exporte régulièrement une copie.</p><div class="actions"><button class="btn" id="export">↓ Exporter mes résultats</button><button class="btn secondary" id="import">↑ Importer une sauvegarde</button></div><div class="note">Important : GitHub Pages héberge l'application, mais ne synchronise pas les données entre appareils. Une suppression des données du navigateur peut effacer ton suivi. Conserve tes exports dans Fichiers ou iCloud Drive.</div><p class="help">L'export inclut les kilomètres, le dénivelé, les statuts, les notes et les exercices de musculation. L'import demande confirmation avant de remplacer les données actuelles.</p>`;document.getElementById('export').onclick=exportData;document.getElementById('import').onclick=()=>document.getElementById('restore').click()}}
function exportData(){let blob=new Blob([JSON.stringify({app:'trail45',version:1,exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='trail45-sauvegarde-'+today+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
document.getElementById('restore').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(obj.app!=='trail45'||!obj.sessions||!obj.exercises||typeof obj.sessions!=='object'||typeof obj.exercises!=='object')throw Error('Format de sauvegarde non reconnu');if(confirm('Remplacer tous les résultats et notes actuels par cette sauvegarde ?')){state={sessions:obj.sessions,exercises:obj.exercises};save();render();alert('Sauvegarde restaurée.')}}catch(err){alert(err.message)}e.target.value=''};
document.addEventListener('change',e=>{let t=e.target;if(t.dataset.id){let id=t.dataset.id,key=t.dataset.key;state.sessions[id]??={};state.sessions[id][key]=t.value;save();if(key==='status'){let y=window.scrollY;render();window.scrollTo(0,y)}}else if(t.dataset.ex){let arr=state.exercises[t.dataset.ex]||[];arr[+t.dataset.i][t.dataset.f]=t.value;save()}});document.addEventListener('input',e=>{let t=e.target;if(t.dataset.id&&t.dataset.key!=='status'){state.sessions[t.dataset.id]??={};state.sessions[t.dataset.id][t.dataset.key]=t.value;save()}else if(t.dataset.ex){let arr=state.exercises[t.dataset.ex]||[];arr[+t.dataset.i][t.dataset.f]=t.value;save()}});document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.add){state.exercises[b.dataset.add]??=[];state.exercises[b.dataset.add].push({name:'',sets:'',reps:'',kg:''});save();let div=document.getElementById('ex-'+b.dataset.add);if(div)div.innerHTML=exerciseRows(b.dataset.add)}if(b.dataset.del){state.exercises[b.dataset.del].splice(+b.dataset.i,1);save();document.getElementById('ex-'+b.dataset.del).innerHTML=exerciseRows(b.dataset.del)}if(b.dataset.expand){let num=+b.dataset.expand;openWeek=openWeek===num-1?-1:num-1;render()}if(b.dataset.tab){tab=b.dataset.tab;if(tab==='all'){openWeek=todayWeek();jumpToCurrent=true;}if(tab==='week')wi=todayWeek();render();if(tab!=='all')window.scrollTo(0,0)}});document.getElementById('goToday').onclick=()=>{tab='week';wi=todayWeek();render();window.scrollTo(0,0)};render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
